name: Render dashboard

on:
  schedule:
    # Istanbul is UTC+3. Render ~30 min before Kindle wakes (06:00 / 17:00).
    - cron: "13 * * * *"
    
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
          pip install -q pillow
      - name: Render PNG
        run: |
          mkdir -p site
          python generator/render.py --out site/dashboard.png
          cp site/dashboard.png site/index.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
